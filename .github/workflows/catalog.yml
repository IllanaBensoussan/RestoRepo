name: Upload catalog to Firestore

on:
  push:
    branches: [main, claude/charming-carson-izbp7q]
    paths: [catalog/**, scripts/seed-catalog.mjs]
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/catalog.test.ts
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npm run seed:catalog
